---
name: Release

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload binaries for
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      # dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      # release-plz/action v0.5
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      # dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      # release-plz/action v0.5
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: release
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        needs.release.outputs.created == 'true') ||
       github.event_name == 'workflow_dispatch')
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      RELEASE_TAG: >-
        ${{ inputs.tag ||
            fromJSON(needs.release.outputs.releases || '[]')[0].tag }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      # dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.target }}
      - name: Verify release exists
        shell: bash
        run: gh release view "$RELEASE_TAG"
      - name: Build binary
        run: >-
          cargo build --locked --release
          --target ${{ matrix.target }} --bin jmap-mcp-rs
      - name: Archive and checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="jmap-mcp-rs-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" jmap-mcp-rs
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          gh release upload "$RELEASE_TAG" \
            "$archive" "${archive}.sha256" --clobber
      - name: Archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "jmap-mcp-rs-$env:RELEASE_TAG-$env:TARGET.zip"
          $binary = "target/$env:TARGET/release/jmap-mcp-rs.exe"
          Compress-Archive -Path $binary -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          $hash = $hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"
          gh release upload $env:RELEASE_TAG `
            $archive "$archive.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
